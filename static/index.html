<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HarvestWindow — Palm Bunch Classifier</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f4f0;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #2d6a2d;
      margin-bottom: 0.25rem;
    }
    .subtitle { color: #555; font-size: 0.9rem; margin-bottom: 2rem; }

    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 2rem;
      width: 100%;
      max-width: 520px;
    }

    /* Upload zone */
    .upload-zone {
      border: 2px dashed #b0cbb0;
      border-radius: 8px;
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }
    .upload-zone:hover, .upload-zone.drag-over {
      border-color: #2d6a2d;
      background: #f5fff5;
    }
    .upload-zone input[type=file] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    .upload-icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
    .upload-label { color: #555; font-size: 0.9rem; }
    .upload-label strong { color: #2d6a2d; }

    #preview {
      display: none;
      width: 100%;
      max-height: 280px;
      object-fit: contain;
      border-radius: 6px;
      margin-top: 1rem;
    }

    #filename {
      margin-top: 0.5rem;
      font-size: 0.8rem;
      color: #777;
      text-align: center;
    }

    .btn {
      display: block;
      width: 100%;
      margin-top: 1.25rem;
      padding: 0.75rem;
      background: #2d6a2d;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover:not(:disabled) { background: #245224; }
    .btn:disabled { background: #9ab89a; cursor: not-allowed; }

    /* Processing steps */
    #processing {
      display: none;
      margin-top: 1.5rem;
    }
    .steps { list-style: none; }
    .step {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.5rem 0;
      color: #999;
      font-size: 0.9rem;
      transition: color 0.3s;
    }
    .step.active { color: #2d6a2d; font-weight: 600; }
    .step.done { color: #555; }
    .step-icon { font-size: 1.1rem; width: 1.4rem; text-align: center; }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid #d0e8d0;
      border-top-color: #2d6a2d;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Result */
    #result {
      display: none;
      margin-top: 1.5rem;
    }

    .result-badge {
      display: inline-block;
      padding: 0.2rem 0.7rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
    }
    .badge-classified { background: #d4edda; color: #155724; }
    .badge-rejected   { background: #f8d7da; color: #721c24; }
    .badge-anomaly    { background: #fff3cd; color: #856404; }

    .result-main {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      line-height: 1.3;
    }
    .result-sub {
      font-size: 0.9rem;
      color: #555;
      margin-bottom: 0.75rem;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.35rem 0.75rem;
      font-size: 0.85rem;
      border-top: 1px solid #eee;
      padding-top: 0.75rem;
      margin-top: 0.75rem;
    }
    .detail-key { color: #888; }
    .detail-val { color: #1a1a1a; font-weight: 500; }

    .confidence-bar-wrap {
      height: 6px; background: #e8e8e8; border-radius: 3px; margin-top: 0.2rem;
    }
    .confidence-bar {
      height: 100%; border-radius: 3px; background: #2d6a2d;
      transition: width 0.6s ease;
    }

    .retry-btn {
      display: block;
      width: 100%;
      margin-top: 1rem;
      padding: 0.6rem;
      background: transparent;
      color: #2d6a2d;
      border: 1.5px solid #2d6a2d;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    .retry-btn:hover { background: #f5fff5; }
  </style>
</head>
<body>

<h1>HarvestWindow</h1>
<p class="subtitle">Palm bunch stage &amp; ripeness classifier</p>

<div class="card">
  <!-- Upload zone -->
  <div class="upload-zone" id="uploadZone">
    <input type="file" id="fileInput" accept="image/*">
    <div class="upload-icon">🌴</div>
    <div class="upload-label"><strong>Choose a photo</strong> or drag &amp; drop</div>
    <div class="upload-label" style="margin-top:0.25rem">JPG, PNG accepted</div>
  </div>

  <img id="preview" alt="Preview">
  <div id="filename"></div>

  <button class="btn" id="uploadBtn" disabled>Classify</button>

  <!-- Processing indicator -->
  <div id="processing">
    <ul class="steps" id="stepList">
      <li class="step" id="step0">
        <span class="step-icon">🔍</span> Checking photo quality...
      </li>
      <li class="step" id="step1">
        <span class="step-icon">🎯</span> Detecting palm bunch...
      </li>
      <li class="step" id="step2">
        <span class="step-icon">🌈</span> Classifying ripeness...
      </li>
      <li class="step" id="step3">
        <span class="step-icon">📋</span> Generating recommendation...
      </li>
    </ul>
  </div>

  <!-- Result -->
  <div id="result"></div>
</div>

<script>
const fileInput = document.getElementById('fileInput');
const uploadZone = document.getElementById('uploadZone');
const preview = document.getElementById('preview');
const filenameEl = document.getElementById('filename');
const uploadBtn = document.getElementById('uploadBtn');
const processingEl = document.getElementById('processing');
const resultEl = document.getElementById('result');

let selectedFile = null;

// File selection
fileInput.addEventListener('change', () => {
  if (fileInput.files[0]) selectFile(fileInput.files[0]);
});

uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('drag-over');
  if (e.dataTransfer.files[0]) selectFile(e.dataTransfer.files[0]);
});

function selectFile(file) {
  selectedFile = file;
  filenameEl.textContent = file.name;
  const reader = new FileReader();
  reader.onload = e => { preview.src = e.target.result; preview.style.display = 'block'; };
  reader.readAsDataURL(file);
  uploadBtn.disabled = false;
  resultEl.style.display = 'none';
  resultEl.innerHTML = '';
}

// Upload + classify
uploadBtn.addEventListener('click', async () => {
  if (!selectedFile) return;

  uploadBtn.disabled = true;
  processingEl.style.display = 'block';
  resultEl.style.display = 'none';
  resultEl.innerHTML = '';

  // Reset steps
  const steps = document.querySelectorAll('.step');
  steps.forEach(s => { s.classList.remove('active', 'done'); });

  // Animate steps while request is in flight
  let currentStep = 0;
  const stepDelay = 1500; // ms per step
  function advanceStep() {
    if (currentStep < steps.length) {
      if (currentStep > 0) {
        steps[currentStep - 1].classList.remove('active');
        steps[currentStep - 1].classList.add('done');
        const prevIcon = steps[currentStep - 1].querySelector('.step-icon');
        prevIcon.textContent = '✓';
      }
      steps[currentStep].classList.add('active');
      const icon = steps[currentStep].querySelector('.step-icon');
      icon.innerHTML = '<span class="spinner"></span>';
      currentStep++;
    }
  }
  advanceStep();
  const stepTimer = setInterval(advanceStep, stepDelay);

  try {
    const form = new FormData();
    form.append('image', selectedFile);
    form.append('language', 'id');

    const resp = await fetch('/api/classify', { method: 'POST', body: form });
    clearInterval(stepTimer);

    // Mark remaining steps done
    steps.forEach(s => {
      s.classList.remove('active');
      s.classList.add('done');
      const icon = s.querySelector('.step-icon');
      if (icon.querySelector('.spinner')) icon.textContent = '✓';
    });

    const data = await resp.json();
    processingEl.style.display = 'none';
    showResult(data);
  } catch (err) {
    clearInterval(stepTimer);
    processingEl.style.display = 'none';
    showError(err.message);
  } finally {
    uploadBtn.disabled = false;
  }
});

function showResult(data) {
  resultEl.style.display = 'block';

  if (data.status === 'rejected') {
    const reasonText = {
      blurry: 'Photo is too blurry — please retake in better focus.',
      poor_lighting: 'Lighting is too dark or too bright — retake in better light.',
      no_bunch_detected: 'No palm bunch detected in this photo — make sure the bunch is clearly visible.',
    }[data.reason] || data.reason;

    resultEl.innerHTML = `
      <span class="result-badge badge-rejected">Rejected</span>
      <div class="result-main" style="color:#721c24">${reasonText}</div>
      <button class="retry-btn" onclick="resetUI()">Try another photo</button>
    `;

  } else if (data.status === 'anomaly') {
    resultEl.innerHTML = `
      <span class="result-badge badge-anomaly">Needs Verification</span>
      <div class="result-main" style="color:#856404">Manual check required</div>
      <div class="result-sub">${data.message}</div>
      <div class="detail-grid">
        <span class="detail-key">Stage</span><span class="detail-val">${data.stage}</span>
        <span class="detail-key">Ripeness</span><span class="detail-val">${fmt(data.ripeness)}</span>
      </div>
      <button class="retry-btn" onclick="resetUI()">Try another photo</button>
    `;

  } else { // classified
    const recheckText = data.recheck_window_weeks
      ? `${data.recheck_window_weeks[0]}–${data.recheck_window_weeks[1]} weeks`
      : '—';
    const savingsText = `Rp ${data.estimated_savings_idr.toLocaleString('id-ID')}`;

    resultEl.innerHTML = `
      <span class="result-badge badge-classified">Classified</span>
      <div class="result-main" style="color:#155724">${data.recommendation}</div>
      <div class="result-sub">${data.reasoning}</div>
      <div class="detail-grid">
        <span class="detail-key">Stage</span><span class="detail-val">${data.stage}</span>
        <span class="detail-key">Ripeness</span><span class="detail-val">${fmt(data.ripeness)}</span>
        <span class="detail-key">Recheck in</span><span class="detail-val">${recheckText}</span>
        <span class="detail-key">Confidence</span>
        <span class="detail-val">
          ${data.confidence}%
          <div class="confidence-bar-wrap">
            <div class="confidence-bar" style="width:${data.confidence}%"></div>
          </div>
        </span>
        <span class="detail-key">Est. savings</span><span class="detail-val">${savingsText}</span>
      </div>
      <button class="retry-btn" onclick="resetUI()">Classify another photo</button>
    `;
  }
}

function showError(msg) {
  resultEl.style.display = 'block';
  resultEl.innerHTML = `
    <span class="result-badge badge-rejected">Error</span>
    <div class="result-main" style="color:#721c24">Request failed</div>
    <div class="result-sub">${msg}</div>
    <button class="retry-btn" onclick="resetUI()">Try again</button>
  `;
}

function fmt(s) {
  return s.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

function resetUI() {
  selectedFile = null;
  fileInput.value = '';
  preview.style.display = 'none';
  filenameEl.textContent = '';
  uploadBtn.disabled = true;
  resultEl.style.display = 'none';
  resultEl.innerHTML = '';
  processingEl.style.display = 'none';
}
</script>
</body>
</html>
