# HarvestWindow — Model 2 SMOKE TEST config (1 epoch, fast)

model:
  backbone: mobilenet_v2
  num_classes: 5

data:
  root: "data/An Ordinal Dataset for Ripeness Level Classification in Oil Palm Fruit Quality Grading/An Ordinal Dataset for Ripeness Level Classification in Oil Palm Fruit Quality Grading/Dataset/Dataset"

training:
  epochs: 1
  batch: 16
  patience: 1
  seed: 42
  image_size: 224
  optimizer:
    name: adam
    lr: 0.0001
    betas: [0.9, 0.999]
    weight_decay: 0.0001

augmentation:
  brightness: 0.3
  contrast: 0.3
  saturation: 0.2
  hue: 0.02
  grayscale_prob: 0.1
  crop_scale_min: 0.7
  crop_scale_max: 1.0
  hflip_prob: 0.5
  rotation_degrees: 10

output:
  dir: ./runs/test/model2
