# HarvestWindow — Model 2 evaluation config

model:
  backbone: mobilenet_v2     # must match what was used in training
  weights: weights/model2_ripeness_mobilenetv3large.pt
  num_classes: 5

data:
  root: "data/An Ordinal Dataset for Ripeness Level Classification in Oil Palm Fruit Quality Grading/An Ordinal Dataset for Ripeness Level Classification in Oil Palm Fruit Quality Grading/Dataset/Dataset"
  split: test

metrics:
  - confusion_matrix
  - per_class_precision_recall_f1
  - overall_accuracy

output:
  dir: ./evals/model2
